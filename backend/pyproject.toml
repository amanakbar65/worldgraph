[project]
name = "worldgraph"
version = "0.1.0"
description = "WorldGraph backend: database, api.* SQL layer, sample data and live pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "psycopg[binary]>=3.3",
    "psycopg-pool>=3.3",
    "typer>=0.27",
    "pyyaml>=6.0",
    "h3>=4.5",
    "httpx>=0.28",
]

[project.scripts]
wg = "worldgraph.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    "jsonschema>=4.25",
]
pipeline = [
    "anthropic>=1.12.0",
    "fastembed>=0.9.0",
    "feedparser>=6.0.14",
    "numpy>=2.5.3",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a Postgres database (set TEST_DATABASE_URL)",
]
