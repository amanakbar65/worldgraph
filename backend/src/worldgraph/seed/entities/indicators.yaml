# KPI series for the sample data (see seed/README.md, "Indicators").
#
# Each line describes one series; build.py generates the points from it
# deterministically. Names say what is measured, but every value is
# illustrative ("Sample series"): levels are plausible for 2025-2026 and the
# trends follow the sample storylines, not real releases.
#
# Fields: start = first value, end = latest value, volatility = noise as a
# fraction of |end - start| (or of the level when start == end).
# Policy rates use volatility 0 so they move smoothly, without noise.
#
# higher_is:
#   inflation, fuel and power prices, currency per USD (weaker local currency),
#   energy, fertiliser and container-freight costs -> worse
#   PMI, export growth -> better
#   policy rates, power demand, most commodity prices -> neutral
#
# Per subject, the most useful KPI comes first (the region panel shows up to 4).
#
# The noise is seeded from the id, and the latest change (last point minus the
# one before) comes mostly from that noise. Where a storyline needs it (Brent,
# freight, arabica, cocoa, rice, modules, naira, Egyptian pound, Nigerian
# inflation and petrol, Indian power demand ...), `points` or the id was chosen
# so the latest move agrees with the story. Changing either can flip the
# KPI tile's arrow, so recheck it with `uv run wg seed check` and a look at the
# last two points.

