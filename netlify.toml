# WorldGraph website on Netlify. Built and documented, NOT deployed until the
# owner says so. The frontend lives in frontend/, so it is the base directory
# (functions then resolve frontend/node_modules).
#
# Environment variables (Netlify → Site configuration → Environment variables):
#   DATABASE_URL            Supabase → Connect → Session pooler URI (required)
#   DATABASE_CA_CERT        Supabase CA certificate (PEM), to verify TLS (recommended)
#   ANTHROPIC_API_KEY       Claude API key, for Ask and projections (optional; AI is off without it)
#   WG_AI_MODEL             default claude-opus-5-5
#   WG_AI_DAILY_BUDGET_USD  default 2 (shared with the pipeline's analysis job, UTC days)

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # pg tries to load its optional native driver; it isn't installed or needed.
  external_node_modules = ["pg-native"]

[[redirects]]
  from = "/api/rpc"
  to = "/.netlify/functions/rpc"
  status = 200
  force = true

[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
