# WorldGraph website on Netlify. Built and documented, NOT deployed until the
# owner says so. The frontend lives in frontend/, so it is the base directory
# (functions then resolve frontend/node_modules).
#
# Environment variables (Netlify → Site configuration → Environment variables):
#   DATABASE_URL            Supabase → Connect → pooler URI (required)
#   DATABASE_CA_CERT        not needed: TLS to the database is always verified, against
#                           Supabase's root CA bundled in frontend/server/db.ts (valid to
#                           April 2031). Set it (PEM) only to trust a different CA.
#   ANTHROPIC_API_KEY       Claude API key, for Ask and projections (optional; AI is off without it)
#   WG_AI_MODEL             default claude-opus-5-5
#   WG_AI_DAILY_BUDGET_USD  default 2 (shared with the pipeline's analysis job, UTC days)

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  # Every production deploy costs credits (the free plan pauses the site at its cap), so the
  # website deploys only on purpose: a commit whose message contains "[deploy]" AND that changes
  # what the website serves (compared with the last deploy). Exit 0 = skip. Runs in frontend/.
  ignore = "case \"$(git log -1 --format=%B)\" in *'[deploy]'*) git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public server netlify index.html package.json package-lock.json vite.config.ts ../netlify.toml ':(exclude)src/**/*.test.ts' ':(exclude)src/**/*.test.tsx' ;; *) exit 0 ;; esac"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # pg tries to load its optional native driver; it isn't installed or needed.
  external_node_modules = ["pg-native"]

[[redirects]]
  from = "/api/rpc"
  to = "/.netlify/functions/rpc"
  status = 200
  force = true

[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    # Test deployment: keep it out of search engines until the owner launches it.
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
