name: Live data

# Every 15 minutes: news, hazards and crowd forecasts into the database.
# Needs the repository secret DATABASE_URL (Supabase "Session pooler" URI).
# ANTHROPIC_API_KEY is optional and only for the deployed website: without it
# the job skips AI analysis (the test link analyses stories on the owner's own
# Claude account instead).
#
# Secrets reach only the two steps that use them (migrations and the
# pipeline), never the third-party actions or the install. Actions are pinned
# to commit SHAs (the tag each one was is in the comment); checkout keeps no
# token in .git/config.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      WG_ENV: production
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check configuration
        id: config
        working-directory: .
        env:
          HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
        run: |
          if [ "$HAS_DATABASE_URL" != "true" ]; then
            echo "::notice::Add the DATABASE_URL repository secret to turn on live data. Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.config.outputs.ready == 'true'
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: steps.config.outputs.ready == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Embedding model cache
        if: steps.config.outputs.ready == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .fastembed
          key: fastembed-paraphrase-multilingual-mpnet-base-v2-v1

      - name: Install
        if: steps.config.outputs.ready == 'true'
        run: uv sync --locked --no-dev --group pipeline

      - name: Database migrations
        if: steps.config.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run wg db migrate

      - name: Pipeline
        if: steps.config.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run wg pipeline run
