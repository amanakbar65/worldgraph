name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Start PostgreSQL with PostGIS and pgvector
        working-directory: .
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16-postgis-3 postgresql-16-pgvector
          sudo systemctl start postgresql
          sudo -u postgres psql -q -c "create role wg login superuser password 'wg'"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        run: uv sync --locked --group pipeline

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Sample data
        run: uv run wg seed check

      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql://wg:wg@localhost:5432/postgres
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
